name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: Destination fixed by the calling release workflow
        required: true
        type: string
    secrets:
      DEPLOY_TFVARS_JSON:
        description: Terraform inputs for the selected GitHub environment
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.environment == 'staging' ||
        (inputs.environment == 'prod' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.release.outputs.dashboard_url }}
    concurrency:
      group: aws-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify this release is still current
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The default branch has advanced. Deploy the newer release."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Assume the environment's AWS deployment role
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: release-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 5400
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Publish, apply and verify the release
        id: release
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_TFVARS_JSON: ${{ secrets.DEPLOY_TFVARS_JSON }}
        run: bash .github/scripts/deploy.sh "$DEPLOY_ENVIRONMENT"
