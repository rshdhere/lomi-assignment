name: staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_STAGING == 'true')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      DEPLOY_TFVARS_JSON: ${{ secrets.DEPLOY_TFVARS_JSON }}
    with:
      environment: staging
