name: CI

# Staging deployment calls the same checks for every push to main.
on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lomi_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U review -d lomi_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils shellcheck
          npm install --global pnpm@10.28.0
          pnpm install --frozen-lockfile
      - name: Check release scripts
        run: shellcheck .github/scripts/*.sh infra/modules/aws/runtime/publish.sh
      - run: pnpm lint
      - run: pnpm check-types
      - name: Run workspace tests against disposable Postgres
        env:
          DATABASE_URL: postgres://review:ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/lomi_ci
          RUN_DB_TESTS: "1"
        run: pnpm test
      - run: pnpm build

  integration:
    name: Recovery and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # revision.mjs targets this exact project when testing a worker crash and Redis flush.
      COMPOSE_PROJECT_NAME: lomi-check
      COMPOSE_FILE: compose.yaml:tests/integration/compose.yaml
      COMPOSE_PROFILES: web-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install browser test dependencies
        run: |
          npm install --global pnpm@10.28.0
          pnpm --filter web... install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Start Compose with the deterministic model provider
        run: |
          docker compose build --build-arg NEXT_PUBLIC_API_ORIGIN=http://localhost:14000 init frontend
          docker compose up --no-build --detach
          curl --retry 60 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://localhost:14000/health
          curl --retry 60 --retry-connrefused --retry-delay 2 --fail --silent --show-error --output /dev/null http://localhost:3000
      - name: Exercise interrupted extraction, review carry-over and batch replay
        run: node tests/integration/revision.mjs --recovery
      - name: Review and revise a PDF in Chromium
        run: pnpm --filter web test:e2e
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: review-screenshots-${{ github.run_attempt }}
          path: |
            apps/frontend/evidence/report-gap.png
            apps/frontend/evidence/invoice-reviewed.png
            apps/frontend/evidence/invoice-revised.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Show integration logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove integration volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Check deployment IAM isolation
        run: python3 -m unittest discover -s infra/bootstrap/staging-iam
      - name: Validate locked roots without connecting to AWS
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/terraform-providers"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for root in infra/bootstrap infra/environments/staging infra/environments/prod infra/modules/aws; do
            terraform -chdir="$root" init -input=false -backend=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Plan deployment and document storage with mock providers
        run: terraform -chdir=infra/modules/aws test -parallelism=1
