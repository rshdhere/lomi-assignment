name: prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion:
    name: Verify this commit on staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the staging release for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-staging-release.sh

  production:
    needs: promotion
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
